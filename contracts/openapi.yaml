openapi: 3.1.0
info:
  title: ATS Arunika API
  version: 0.1.0
  description: |
    Kontrak API sistem rekrutmen. Semua rute relatif terhadap `/api/v1`.

    **Autentikasi:** cookie sesi `ats_session` (HttpOnly, SameSite=Lax, Secure di produksi).
    **CSRF:** setiap mutasi (POST/PUT/PATCH/DELETE) wajib `Origin` sama dengan origin portal; bila bersesi,
    wajib header `X-CSRF-Token` berisi `csrfToken` dari `GET /auth/session` atau respons login.
    **Error:** bentuk stabil `{ error: { code, message, fieldErrors?, details? }, requestId }`.
    Kode HTTP: 400 bad_request, 401 unauthenticated, 403 forbidden/csrf_failed, 404 not_found,
    409 conflict (stale_version, already_applied, job_closed, ...), 413 payload_too_large,
    422 validation_failed, 429 rate_limited (dengan Retry-After), 503 unavailable.
    **Idempotensi:** operasi penting menerima header `Idempotency-Key` (8-128 karakter), di-scope per aktor + operasi + resource.
    Ulangan identik mengembalikan hasil lama (header `Idempotent-Replay: true`), payload berbeda -> 409 idempotency_mismatch.
    **Pagination:** keyset; parameter `cursor` opaque dan `limit` dengan batas per endpoint.
servers:
  - url: /api/v1
tags:
  - name: publik
  - name: akun
  - name: kandidat
  - name: staf
  - name: workflow
  - name: ujian
  - name: ujian-staf
paths:
  /org:
    get:
      tags: [publik]
      summary: Profil organisasi, brand, master unit dan lokasi untuk filter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOrg" }
  /jobs:
    get:
      tags: [publik]
      summary: Daftar lowongan terbit
      parameters:
        - { name: unit, in: query, schema: { type: string }, description: Kode unit }
        - { name: location, in: query, schema: { type: string }, description: Kode lokasi }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/EmploymentType" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PublicJob" } }
                  nextCursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/Error" }
  /jobs/{slug}:
    get:
      tags: [publik]
      summary: Detail lowongan (draft = 404; tutup tetap tampil dengan status)
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicJobDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{slug}/apply:
    post:
      tags: [kandidat]
      summary: Melamar lowongan
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "201":
          description: Lamaran dibuat
          content:
            application/json:
              schema:
                type: object
                required: [applicationId, stage, appliedAt]
                properties:
                  applicationId: { type: string, format: uuid }
                  stage: { type: string }
                  appliedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: email_unverified | profile_incomplete | identity_pending | already_applied | job_closed | idempotency_mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
  /auth/session:
    get:
      tags: [akun]
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [akun]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                code: { type: string, description: Kode TOTP atau kode pemulihan; wajib bila MFA aktif (401 mfa_required / mfa_invalid) }
      responses:
        "200":
          description: Login berhasil; cookie sesi diset (rotasi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { description: invalid_credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [akun]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Sesi dicabut }
  /auth/register:
    post:
      tags: [akun]
      summary: Pendaftaran kandidat; respons selalu netral
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      tags: [akun]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TokenRequest" } } }
      responses:
        "200":
          description: Terverifikasi
          content: { application/json: { schema: { type: object, required: [verified], properties: { verified: { type: boolean } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /auth/resend-verification:
    post:
      tags: [akun]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Sudah terverifikasi, content: { application/json: { schema: { $ref: "#/components/schemas/Queued" } } } }
        "202": { description: Diantrikan, content: { application/json: { schema: { $ref: "#/components/schemas/Queued" } } } }
  /auth/forgot-password:
    post:
      tags: [akun]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /auth/reset-password:
    post:
      tags: [akun]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TokenRequest" } } }
      responses:
        "200": { description: Sandi diganti, semua sesi dicabut, content: { application/json: { schema: { type: object, required: [reset], properties: { reset: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/profile:
    get:
      tags: [kandidat]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
    put:
      tags: [kandidat]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/applications:
    get:
      tags: [kandidat]
      responses:
        "200":
          description: Lamaran milik kandidat
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MyApplication" } }
  /me/applications/{id}/timeline:
    get:
      tags: [kandidat]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Timeline" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /me/applications/{id}/withdraw:
    post:
      tags: [kandidat]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                reason: { type: string, maxLength: 500 }
                version: { type: integer }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TransitionResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /me/notifications:
    get:
      tags: [kandidat]
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
  /me/notifications/{id}/read:
    post:
      tags: [kandidat]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Ditandai dibaca }
  /staff/jobs:
    get:
      tags: [staf]
      summary: Lowongan dalam scope staf (jobs.read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StaffJob" } }
    post:
      tags: [staf]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JobInput" } } }
      responses:
        "201": { description: Dibuat sebagai draft }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /staff/jobs/{id}/publish:
    post:
      tags: [staf]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody: { $ref: "#/components/requestBodies/VersionReason" }
      responses:
        "200": { description: Terbit; cache publik diinvalidasi }
        "409": { $ref: "#/components/responses/Error" }
  /staff/jobs/{id}/close:
    post:
      tags: [staf]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody: { $ref: "#/components/requestBodies/VersionReason" }
      responses:
        "200": { description: Ditutup }
        "409": { $ref: "#/components/responses/Error" }
  /applications:
    get:
      tags: [staf]
      summary: Lamaran dalam scope (deny-by-default di query)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApplicationStatus" } }
        - { name: stage, in: query, schema: { type: string } }
        - { name: job, in: query, schema: { type: string, format: uuid } }
        - { name: shortlisted, in: query, description: Hanya lamaran yang di-shortlist, schema: { type: string, enum: ["true"] } }
        - { name: recruiter, in: query, description: '"me" atau ID staf penanggung jawab', schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StaffApplication" } }
                  nextCursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Error" }
  /applications/{id}:
    get:
      tags: [staf]
      summary: Detail lamaran (di luar scope dijawab 404)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /applications/{id}/transitions:
    post:
      tags: [staf]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, expectedVersion]
              properties:
                kind: { type: string, enum: [manual, reject] }
                to: { type: string }
                reason: { type: string, maxLength: 1000 }
                expectedVersion: { type: integer }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TransitionResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: stale_version | transition_not_allowed | guard_failed | application_inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /applications/{id}/approvals:
    post:
      tags: [staf]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, expectedVersion]
              properties:
                decision: { type: string, enum: [approve, reject] }
                comment: { type: string, maxLength: 2000 }
                expectedVersion: { type: integer }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TransitionResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: self_approval | already_decided | not_in_approval | application_inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /applications/{id}/reveal-identity:
    post:
      tags: [staf]
      summary: Membuka NIK (izin identity.reveal, alasan wajib, teraudit)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 10 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [nik], properties: { nik: { type: string } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workflows:
    get:
      tags: [workflow]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, key, name, draftRevision, activeVersionNo]
                      properties:
                        id: { type: string, format: uuid }
                        key: { type: string }
                        name: { type: string }
                        draftRevision: { type: integer }
                        activeVersionNo: { type: [integer, "null"] }
  /workflows/{id}:
    get:
      tags: [workflow]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDetail" } } } }
  /workflows/{id}/draft:
    put:
      tags: [workflow]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition, draftRevision]
              properties:
                name: { type: string }
                definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                draftRevision: { type: integer }
      responses:
        "200":
          description: Tersimpan (boleh masih punya temuan)
          content:
            application/json:
              schema:
                type: object
                required: [draftRevision, issues]
                properties:
                  draftRevision: { type: integer }
                  issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        "409": { $ref: "#/components/responses/Error" }
  /workflows/{id}/validate:
    post:
      tags: [workflow]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { definition: { $ref: "#/components/schemas/WorkflowDefinition" } } } } }
      responses:
        "200":
          description: Hasil validasi
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid: { type: boolean }
                  issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
  /workflows/{id}/simulate:
    post:
      tags: [workflow]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                steps: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/SimStep" } }
      responses:
        "200":
          description: Langkah simulasi tanpa side effect
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      required: [stage, matched, ok]
                      properties:
                        stage: { type: string }
                        edgeId: { type: string }
                        matched: { type: string }
                        ok: { type: boolean }
        "409": { $ref: "#/components/responses/Error" }
  /workflows/{id}/publish:
    post:
      tags: [workflow]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draftRevision]
              properties:
                draftRevision: { type: integer }
                notes: { type: string }
      responses:
        "201":
          description: Versi immutable baru aktif untuk lamaran baru
          content:
            application/json:
              schema:
                type: object
                required: [versionId, versionNo]
                properties:
                  versionId: { type: string, format: uuid }
                  versionNo: { type: integer }
        "409": { description: workflow_invalid | stale_version, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /workflows/{id}/versions:
    get:
      tags: [workflow]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WorkflowVersion" } }
  /workflows/{id}/rollback:
    post:
      tags: [workflow]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, reason]
              properties:
                versionId: { type: string, format: uuid }
                reason: { type: string, minLength: 5 }
      responses:
        "200": { description: Versi diaktifkan untuk lamaran baru }
  /me/exam-invitations:
    get:
      tags: [ujian]
      summary: Undangan ujian milik kandidat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, serverTime]
                properties:
                  serverTime: { type: string, format: date-time }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, status, extraMinutes, scheduleName, opensAt, closesAt, durationMinutes, packageName, jobTitle, attemptId, attemptStatus]
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [invited, started, submitted, expired, cancelled] }
                        extraMinutes: { type: integer }
                        scheduleName: { type: string }
                        opensAt: { type: string, format: date-time }
                        closesAt: { type: string, format: date-time }
                        durationMinutes: { type: integer }
                        packageName: { type: string }
                        jobTitle: { type: string }
                        attemptId: { type: [string, "null"], format: uuid }
                        attemptStatus: { type: [string, "null"] }
  /exam-invitations/{id}/start:
    post:
      tags: [ujian]
      summary: Mulai attempt. Retry mengembalikan attempt yang sama (200); attempt baru 201.
      description: Mengunci undangan, memeriksa peserta, jendela jadwal, kuota attempt. started_at dan deadline_at dari jam server (termasuk akomodasi).
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Attempt berjalan, content: { application/json: { schema: { $ref: "#/components/schemas/Attempt" } } } }
        "201": { description: Attempt baru, content: { application/json: { schema: { $ref: "#/components/schemas/Attempt" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: schedule_not_open | schedule_closed | attempts_exhausted | invitation_cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /exam-attempts/{id}:
    get:
      tags: [ujian]
      summary: Resume. Cache-Control private, no-store. Tidak memuat kunci, bobot, rubric, seed, atau ID opsi asli.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Attempt" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /exam-attempts/{id}/answers:
    put:
      tags: [ujian]
      summary: Autosave batch atomik (maks 50 item, body 256 KiB). ACK setelah commit.
      description: |
        Retry dengan opId sama mengembalikan ACK yang sama byte-per-byte (receipt), termasuk setelah deadline.
        opId sama dengan payload berbeda menghasilkan 409 idempotency_mismatch.
        baseRevision tiap item harus sama dengan revisi server; bila tidak, 409 answer_conflict dengan state server dan tidak ada item yang diterapkan.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opId, answers]
              properties:
                opId: { type: string, minLength: 8, maxLength: 100 }
                answers: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/AnswerInput" } }
      responses:
        "200":
          description: ACK
          content:
            application/json:
              schema:
                type: object
                required: [revision, savedAt, items]
                properties:
                  revision: { type: integer }
                  savedAt: { type: string, format: date-time }
                  items: { type: array, items: { type: object, required: [itemId, revision], properties: { itemId: { type: string, format: uuid }, revision: { type: integer } } } }
        "409": { description: answer_conflict | deadline_passed | attempt_finalized | idempotency_mismatch, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /exam-attempts/{id}/submit:
    post:
      tags: [ujian]
      summary: Finalisasi sekali. Idempotency-Key wajib. Retry identik mengembalikan receipt sama.
      description: Lewat deadline, attempt difinalisasi dengan jawaban committed terakhir dan dijawab 409 deadline_passed dengan details.receipt.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/CSRF" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer }
                opId: { type: string }
                answers: { type: array, items: { $ref: "#/components/schemas/AnswerInput" } }
      responses:
        "200": { description: Receipt, content: { application/json: { schema: { $ref: "#/components/schemas/Receipt" } } } }
        "409": { description: stale_revision | deadline_passed | attempt_finalized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /exam-attempts/{id}/heartbeat:
    post:
      tags: [ujian]
      summary: Best-effort, tidak memperpanjang sesi. Dibatasi 10 per menit per attempt.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [serverTime], properties: { serverTime: { type: string, format: date-time } } } } } }
  /exam-schedules:
    get:
      tags: [ujian-staf]
      responses: { "200": { description: Daftar jadwal } }
    post:
      tags: [ujian-staf]
      summary: Jadwal baru memakai versi paket terbit terbaru (exams.manage)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageKey, name, opensAt, closesAt]
              properties:
                packageKey: { type: string }
                name: { type: string }
                opensAt: { type: string, format: date-time }
                closesAt: { type: string, format: date-time }
                maxAttempts: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "201": { description: Dibuat }
        "422": { $ref: "#/components/responses/Error" }
  /exam-schedules/{id}/invitations:
    post:
      tags: [ujian-staf]
      summary: Undangan massal; scope diperiksa per lamaran (applications.transition atau exams.manage)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationIds]
              properties:
                applicationIds: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
                extraMinutes: { type: integer, minimum: 0, maximum: 240 }
                reason: { type: string }
      responses:
        "200":
          description: Hasil per lamaran
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [applicationId, outcome]
                      properties:
                        applicationId: { type: string, format: uuid }
                        outcome: { type: string, enum: [invited, already_invited, not_found, wrong_stage] }
  /exam-schedules/{id}/monitor:
    get:
      tags: [ujian-staf]
      summary: Monitoring agregat (satu query); membedakan last_seen, jawaban committed, dan status submit
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /exam-schedules/{id}/release:
    post:
      tags: [ujian-staf]
      summary: Rilis nilai (results.release per scope). Tiap rilis menulis event outbox yang memicu workflow.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [released], properties: { released: { type: integer } } } } } }
  /exam-attempts/{id}/review:
    get:
      tags: [ujian-staf]
      summary: Tampilan penilai esai tanpa identitas kandidat (exams.grade)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /exam-attempts/{id}/essay-grades:
    post:
      tags: [ujian-staf]
      summary: Nilai esai (append-only). Regrade wajib alasan dan tidak memicu transisi workflow kedua.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, points]
              properties:
                itemId: { type: string, format: uuid }
                points: { type: number, minimum: 0 }
                reason: { type: string }
      responses:
        "200": { description: Hasil terbaru }
        "422": { $ref: "#/components/responses/Error" }
  /me/documents:
    get:
      tags: [kandidat]
      summary: Dokumen milik kandidat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      tags: [kandidat]
      summary: Unggah dokumen (multipart kind + file; CV maks 15 MiB, lainnya 5 MiB). PDF/DOCX/DOC/JPG/PNG/WebP, signature diperiksa; objek di karantina dengan nama acak.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [cv, ijazah, sertifikat, lainnya] }
                file: { type: string, format: binary }
      responses:
        "201": { description: Diunggah, status pindai pending }
        "409": { description: document_limit, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/documents/{id}:
    delete:
      tags: [kandidat]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dihapus lunak }
        "404": { $ref: "#/components/responses/Error" }
  /me/documents/{id}/parse:
    post:
      tags: [kandidat]
      summary: Minta pembacaan CV. Idempoten per (kandidat, dokumen, versi konfigurasi parser). Dokumen orang lain = 404. retry=1 mencoba ulang run yang gagal.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }, { name: retry, in: query, schema: { type: string, enum: ["1"] } }]
      responses:
        "202": { description: Diterima; header Location = URL status, content: { application/json: { schema: { $ref: "#/components/schemas/CvParseRun" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/cv-parses:
    get:
      tags: [kandidat]
      summary: Pembacaan CV terbaru milik kandidat (melanjutkan setelah refresh)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CvParseRunItem" } }
  /me/cv-parses/{id}:
    get:
      tags: [kandidat]
      summary: Progres, kegagalan per halaman, saran, bukti, status review
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CvParseRun" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [kandidat]
      summary: Abaikan hasil pembacaan (profil tidak berubah)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Diabaikan }
  /me/cv-parses/{id}/pages/{n}/image:
    get:
      tags: [kandidat]
      summary: Preview halaman privat (JPEG) untuk panel bukti
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: JPEG, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
  /me/cv-parses/{id}/review:
    patch:
      tags: [kandidat]
      summary: Terima, ubah, tolak, atau reset per field atau entri (optimistic concurrency dengan reviewVersion)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewVersion, decisions]
              properties:
                reviewVersion: { type: integer }
                decisions:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/CvDecision" }
      responses:
        "200": { description: Run terbaru, content: { application/json: { schema: { $ref: "#/components/schemas/CvParseRun" } } } }
        "409": { description: stale_review atau not_reviewable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /me/cv-parses/{id}/apply:
    post:
      tags: [kandidat]
      summary: Terapkan pilihan yang disetujui ke profil dalam satu transaksi. Ulang atau klik ganda menghasilkan hasil sama tanpa efek kedua.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewVersion, profileVersion]
              properties:
                reviewVersion: { type: integer }
                profileVersion: { type: integer }
                entries:
                  type: object
                  description: "Pilihan per entri (mis. experience[1]): add, skip, atau replace dengan targetId"
                  additionalProperties: { $ref: "#/components/schemas/CvEntryChoice" }
      responses:
        "200":
          description: Diterapkan
          content:
            application/json:
              schema:
                type: object
                required: [result, alreadyApplied]
                properties:
                  result: { $ref: "#/components/schemas/CvApplyResult" }
                  alreadyApplied: { type: boolean }
        "409": { description: profile_changed, stale_review, atau not_reviewable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /cv-parses/{id}:
    get:
      tags: [staf]
      summary: Hasil pembacaan CV kandidat (applications.read pada salah satu lamaran kandidat; dicatat di audit)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CvParseRun" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/cv-parses/{id}/replay:
    post:
      tags: [staf]
      summary: Jalankan ulang run dead-letter (cv_parses.replay)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "202": { description: Diantrekan ulang }
        "409": { $ref: "#/components/responses/Error" }
  /documents/{id}/link:
    post:
      tags: [kandidat, staf]
      summary: Tautan unduh 60 detik (pemilik, atau staf dengan applications.read atas lamaran pemilik). Hanya status clean.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: scan_pending | scan_infected | scan_error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /documents/download:
    get:
      tags: [kandidat, staf]
      summary: Unduh lewat tautan bertanda tangan; izin diperiksa ulang, akses staf diaudit.
      parameters:
        - { name: d, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Berkas }
        "403": { $ref: "#/components/responses/Error" }
  /applications/{id}/interviews:
    post:
      tags: [staf]
      summary: Jadwalkan interview. Bentrok jadwal interviewer ditolak di level database (exclusion constraint).
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt, durationMinutes, timezone, mode, interviewerIds]
              properties:
                startsAt: { type: string, format: date-time }
                durationMinutes: { type: integer, minimum: 15, maximum: 480 }
                timezone: { type: string, examples: [Asia/Jakarta] }
                mode: { type: string, enum: [onsite, video, phone] }
                location: { type: string, maxLength: 300 }
                interviewerIds: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
      responses:
        "201": { description: Dijadwalkan; kandidat diberi tahu }
        "409": { description: interviewer_conflict | application_inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /interviews/{id}/reschedule:
    post:
      tags: [staf]
      summary: Jadwal ulang dengan zona waktu dan alasan; riwayat dan pemberitahuan menyebut waktu lama dan baru.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt, durationMinutes, timezone, version, reason]
              properties:
                startsAt: { type: string, format: date-time }
                durationMinutes: { type: integer }
                timezone: { type: string }
                version: { type: integer }
                reason: { type: string, minLength: 5 }
      responses:
        "200": { description: OK }
        "409": { description: stale_version | interviewer_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /interviews/{id}/cancel:
    post:
      tags: [staf]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version, reason], properties: { version: { type: integer }, reason: { type: string } } } } }
      responses:
        "204": { description: Dibatalkan; slot interviewer dibebaskan }
        "409": { $ref: "#/components/responses/Error" }
  /interviews/{id}/evaluations:
    post:
      tags: [staf]
      summary: Scorecard oleh interviewer di panel
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, recommendation]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                recommendation: { type: string, enum: [lanjut, pertimbangkan, tidak_lanjut] }
                notes: { type: string, maxLength: 4000 }
      responses:
        "200": { description: OK }
        "403": { description: not_panelist, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /applications/{id}/decision-notice:
    post:
      tags: [staf]
      summary: Recruiter mengirim pemberitahuan keputusan akhir (diterima/ditolak), sekali per lamaran
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: OK }
        "409": { description: decision_notice_unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /staff/jobs/{id}/board:
    get:
      tags: [staf]
      summary: Papan kanban lamaran satu lowongan per tahap workflow aktif (applications.read; maks 500 lamaran)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [job, stages, items, truncated]
                properties:
                  job: { type: object, required: [id, title, unitName], properties: { id: { type: string, format: uuid }, title: { type: string }, unitName: { type: string } } }
                  stages:
                    type: array
                    items: { type: object, required: [key, name, type], properties: { key: { type: string }, name: { type: string }, type: { type: string } } }
                  items: { type: array, items: { $ref: "#/components/schemas/StaffApplication" } }
                  truncated: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
  /interviews:
    get:
      tags: [staf]
      summary: Kalender interview (dalam scope applications.read, ditambah panel milik sendiri); tanpa yang dibatalkan
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: Maksimal 62 hari setelah from, schema: { type: string, format: date-time } }
        - { name: mine, in: query, description: Hanya interview tempat pengguna menjadi interviewer, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, applicationId, startsAt, endsAt, timezone, mode, location, status, candidateName, jobTitle, interviewerNames]
                      properties:
                        id: { type: string, format: uuid }
                        applicationId: { type: string, format: uuid }
                        startsAt: { type: string, format: date-time }
                        endsAt: { type: string, format: date-time }
                        timezone: { type: string }
                        mode: { type: string, enum: [onsite, video, phone] }
                        location: { type: string }
                        status: { type: string, enum: [scheduled, completed] }
                        candidateName: { type: string }
                        jobTitle: { type: string }
                        interviewerNames: { type: array, items: { type: string } }
        "422": { $ref: "#/components/responses/Error" }
  /applications/{id}/shortlist:
    post:
      tags: [staf]
      summary: Tandai atau lepas shortlist (applications.transition dalam scope; dicatat di audit)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shortlisted, expectedVersion]
              properties: { shortlisted: { type: boolean }, expectedVersion: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [shortlisted, version], properties: { shortlisted: { type: boolean }, version: { type: integer } } }
        "409": { description: stale_version, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /applications/{id}/assignable-recruiters:
    get:
      tags: [staf]
      summary: Staf yang boleh ditugaskan menangani lamaran ini (applications.assign dalam scope)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object, required: [id, displayName], properties: { id: { type: string, format: uuid }, displayName: { type: string } } }
  /applications/{id}/recruiter:
    post:
      tags: [staf]
      summary: Tugaskan atau lepas recruiter penanggung jawab (applications.assign dalam scope; dicatat di audit)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recruiterUserId, expectedVersion]
              properties: { recruiterUserId: { type: [string, "null"], format: uuid }, expectedVersion: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [recruiterUserId, version]
                properties: { recruiterUserId: { type: [string, "null"], format: uuid }, version: { type: integer } }
        "409": { description: stale_version, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /requisitions:
    get:
      tags: [staf]
      summary: Requisition dalam scope unit atau milik sendiri
      responses: { "200": { description: OK } }
    post:
      tags: [staf]
      summary: Requisition baru (draft)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitCode, locationCode, title, headcount, employmentType]
              properties:
                unitCode: { type: string }
                locationCode: { type: string }
                title: { type: string }
                headcount: { type: integer, minimum: 1, maximum: 1000 }
                employmentType: { $ref: "#/components/schemas/EmploymentType" }
                justification: { type: string }
      responses: { "201": { description: Dibuat }, "422": { $ref: "#/components/responses/Error" } }
  /requisitions/{id}/{action}:
    post:
      tags: [staf]
      summary: submit/cancel (pemohon), approve/reject (requisitions.approve di unit; pemohon tidak boleh menyetujui sendiri)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: action, in: path, required: true, schema: { type: string, enum: [submit, cancel, approve, reject] } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer }, note: { type: string } } } } }
      responses:
        "200": { description: OK }
        "409": { description: invalid_status | self_approval | stale_version, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
components:
  parameters:
    Slug: { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{3,120}$" } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 } }
    CSRF: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
  requestBodies:
    VersionReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              version: { type: integer }
              reason: { type: string }
  responses:
    Error:
      description: Error terstruktur
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    Message:
      description: Pesan netral
      content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string } } } } }
  schemas:
    Interview:
      type: object
      required: [id, startsAt, endsAt, timezone, mode, location, status, version, interviewerNames, interviewerIds]
      properties:
        id: { type: string, format: uuid }
