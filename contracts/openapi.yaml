        to: { type: string }
        order: { type: integer }
        trigger: { type: string, enum: [manual, event, approval] }
        event: { type: string }
        when: { $ref: "#/components/schemas/Rule" }
        default: { type: boolean }
        label: { type: string }
    WorkflowDefinition:
      type: object
      required: [start, stages, edges]
      properties:
        start: { type: string }
        stages: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/WorkflowStage" } }
        edges: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/WorkflowEdge" } }
    Issue:
      type: object
      required: [path, code, message]
      properties: { path: { type: string }, code: { type: string }, message: { type: string } }
    SimStep:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [manual, event, approval, reject] }
        to: { type: string }
        event: { type: string }
        facts: { type: object, additionalProperties: true }
    WorkflowVersion:
      type: object
      required: [id, versionNo, publishedAt, notes, publishedByName, active]
      properties:
        id: { type: string, format: uuid }
        versionNo: { type: integer }
        publishedAt: { type: string, format: date-time }
        notes: { type: string }
        publishedByName: { type: [string, "null"] }
        active: { type: boolean }
    WorkflowDetail:
      type: object
      required: [id, key, name, draft, draftRevision, activeVersionId, issues, versions, activations, catalog]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        draft: { $ref: "#/components/schemas/WorkflowDefinition" }
        draftRevision: { type: integer }
        activeVersionId: { type: [string, "null"], format: uuid }
        issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        versions: { type: array, items: { $ref: "#/components/schemas/WorkflowVersion" } }
        activations:
          type: array
          items:
            type: object
            required: [id, action, reason, createdAt, versionNo]
            properties:
              id: { type: integer }
              action: { type: string, enum: [publish, rollback] }
              reason: { type: string }
              createdAt: { type: string, format: date-time }
              versionNo: { type: integer }
        catalog:
          type: object
          required: [stageTypes, triggers, events, fields, ops]
          properties:
            stageTypes: { type: array, items: { type: string } }
            triggers: { type: array, items: { type: string } }
            events: { type: array, items: { type: string } }
            fields: { type: object, additionalProperties: { type: object, required: [type], properties: { type: { type: string }, values: { type: array, items: { type: string } } } } }
            ops: { type: object, additionalProperties: { type: array, items: { type: string } } }
