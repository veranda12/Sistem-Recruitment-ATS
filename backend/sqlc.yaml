version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: db/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_json_tags: true
        json_tags_case_style: camel
        overrides:
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          - column: users.password_hash
            go_struct_tag: json:"-"
          - column: users.mfa_secret
            go_struct_tag: json:"-"
          - column: sessions.token_digest
            go_struct_tag: json:"-"
          - column: email_tokens.token_digest
            go_struct_tag: json:"-"
          - column: candidate_identities.nik_ciphertext
            go_struct_tag: json:"-"
          - column: candidate_identities.nik_nonce
            go_struct_tag: json:"-"
          - column: candidate_identities.nik_blind_index
            go_struct_tag: json:"-"
          - column: identity_claims.nik_blind_index
            go_struct_tag: json:"-"
          - column: idempotency_keys.payload_digest
            go_struct_tag: json:"-"
          - column: sessions.ip
            go_struct_tag: json:"-"
          - column: sessions.user_agent
            go_struct_tag: json:"-"
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
