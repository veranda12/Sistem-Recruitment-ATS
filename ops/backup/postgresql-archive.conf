# Tambahkan ke postgresql.conf untuk archive WAL (PITR). Contoh RPO 15 menit: archive_timeout = 300 memastikan
# segmen WAL tertutup paling lambat tiap 5 menit walau trafik rendah.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /backup/ats/wal/%f && cp %p /backup/ats/wal/%f'
archive_timeout = 300
# Pantau: SELECT * FROM pg_stat_archiver;  failed_count harus 0 dan last_archived_time < 10 menit.
