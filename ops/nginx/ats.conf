# Nginx untuk ATS: aset frontend + reverse proxy /api pada origin yang sama.
# Salin ke /etc/nginx/conf.d/ats.conf, sesuaikan server_name dan sertifikat. Uji: nginx -t

# Batas lalu lintas lapis edge. Tetap aktif saat Redis mati (limiter aplikasi jatuh ke mode lokal).
limit_req_zone $binary_remote_addr zone=ats_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ats_api:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ats_conn:10m;

upstream ats_api {
    # Dua replika API stateless (sesi di PostgreSQL), resume ujian dapat dilayani instance mana pun.
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name karier.contoh.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name karier.contoh.id;

    ssl_certificate     /etc/ssl/ats/fullchain.pem;
    ssl_certificate_key /etc/ssl/ats/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ats_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # SPA: skrip/stylesheet/font hanya dari origin sendiri (font di-self-host, tanpa CDN).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/ats;
    client_max_body_size 6m;   # unggah dokumen 5 MiB + overhead multipart; API menegakkan batas per route
    limit_conn ats_conn 50;

    # Header IP asli diteruskan; API memakai TRUSTED_PROXIES=127.0.0.1 agar X-Forwarded-For hanya dipercaya dari Nginx.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/v1/auth/ {
        limit_req zone=ats_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ats_api;
        proxy_read_timeout 15s;
    }

    location /api/ {
        limit_req zone=ats_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://ats_api;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s;   # di atas deadline laporan aplikasi (30 s)
        proxy_buffering on;
        # Jangan coba ulang request non-idempoten ke replika lain.
        proxy_next_upstream error timeout http_502 http_503 non_idempotent off;
    }

    # Endpoint kesehatan dan metrik internal tidak diekspos.
    location = /metrics { return 404; }
    location = /healthz { return 404; }
    location = /readyz  { return 404; }

    # Aset ber-hash dari Vite: cache panjang dan immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fallback SPA untuk deep link, kecuali /api (ditangani blok di atas).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
